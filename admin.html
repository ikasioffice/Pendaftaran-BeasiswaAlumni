<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin - Beasiswa Alumni - IKASI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="admin-login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="logo-ikasi.png" alt="Logo IKASI" style="width:52px;height:52px;object-fit:contain;margin:0 auto 12px;display:block">
      <h2>Panel Admin</h2>
      <p>Beasiswa Alumni IKASI</p>
    </div>

    <div class="alert alert-danger" id="loginAlert">
      <i class="fas fa-exclamation-circle"></i>
      <span id="loginAlertMsg">Username atau password salah.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label">Username</label>
        <div style="position:relative">
          <input type="text" class="form-control" id="username" placeholder="Masukkan username" autocomplete="username" style="padding-left:42px">
          <i class="fas fa-user" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400)"></i>
        </div>
        <div class="form-error" id="err-username">Username wajib diisi.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-wrapper">
          <input type="password" class="form-control" id="password" placeholder="Masukkan password" autocomplete="current-password" style="padding-left:42px">
          <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400)"></i>
          <i class="fas fa-eye toggle-password" onclick="togglePw()" id="eyeIcon"></i>
        </div>
        <div class="form-error" id="err-password">Password wajib diisi.</div>
      </div>

      <button type="button" class="btn btn-primary btn-block btn-lg" onclick="doLogin()" id="btnLogin" style="margin-top:8px">
        <i class="fas fa-sign-in-alt"></i> Masuk
      </button>
    </form>

    <div style="margin-top:20px;text-align:center">
      <a href="index.html" style="color:var(--gray-400);font-size:.875rem;display:inline-flex;align-items:center;gap:6px">
        <i class="fas fa-arrow-left"></i> Kembali ke Website
      </a>
    </div>
  </div>
</div>

<script src="main.js"></script>
<script src="admin.js"></script>
</body>
</html>
