<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beasiswa Alumni - IKASI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue-1: #0a0f2e;
    --blue-2: #0d1b4b;
    --blue-3: #1a56db;
    --blue-4: #3b82f6;
    --blue-5: #93c5fd;
    --gold: #f59e0b;
    --white: #ffffff;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* ===== BACKGROUND ===== */
  .bg {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #020818 0%, #0a0f2e 40%, #0d1b4b 70%, #091428 100%);
    z-index: 0;
  }

  /* Animated aurora blobs */
  .aurora {
    position: fixed; inset: 0; z-index: 1; overflow: hidden;
  }
  .aurora-blob {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.18; animation: drift 12s ease-in-out infinite;
  }
  .aurora-blob.a1 { width: 600px; height: 600px; background: #1a56db; top: -200px; left: -100px; animation-delay: 0s; }
  .aurora-blob.a2 { width: 500px; height: 500px; background: #7c3aed; top: 30%; right: -150px; animation-delay: -4s; }
  .aurora-blob.a3 { width: 400px; height: 400px; background: #0891b2; bottom: -100px; left: 30%; animation-delay: -8s; }
  .aurora-blob.a4 { width: 300px; height: 300px; background: #f59e0b; top: 60%; left: -80px; animation-delay: -6s; opacity: 0.08; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -40px) scale(1.08); }
    66% { transform: translate(-20px, 30px) scale(0.94); }
  }

  /* ===== STARS ===== */
  .stars { position: fixed; inset: 0; z-index: 2; }
  .star {
    position: absolute; border-radius: 50%; background: white;
    animation: twinkle var(--dur) ease-in-out infinite var(--delay);
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--min-op); transform: scale(1); }
    50% { opacity: var(--max-op); transform: scale(1.4); }
  }

  /* ===== PARTICLES ===== */
  .particles { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .particle {
    position: absolute; border-radius: 50%;
    animation: rise var(--dur) linear infinite var(--delay);
    opacity: 0;
  }
  @keyframes rise {
    0%   { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
    10%  { opacity: var(--op); }
    90%  { opacity: var(--op); }
    100% { transform: translateY(-10vh) translateX(var(--drift)) scale(1); opacity: 0; }
  }

  /* ===== GRID LINES ===== */
  .grid {
    position: fixed; inset: 0; z-index: 2;
    background-image:
      linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }

  /* ===== MAIN CONTENT ===== */
  .splash {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }

  /* Logo ring */
  .logo-wrap {
    position: relative; margin-bottom: 40px;
    opacity: 0; transform: scale(0.5);
    animation: logoIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
  }
  @keyframes logoIn {
    to { opacity: 1; transform: scale(1); }
  }

  .logo-ring {
    width: 140px; height: 140px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo-ring::before {
    content: '';
    position: absolute; inset: -4px; border-radius: 50%;
    background: conic-gradient(from 0deg, #1a56db, #7c3aed, #f59e0b, #1a56db);
    animation: spin 3s linear infinite;
    z-index: -1;
  }
  .logo-ring::after {
    content: '';
    position: absolute; inset: -8px; border-radius: 50%;
    background: conic-gradient(from 0deg, #1a56db, #7c3aed, #f59e0b, #1a56db);
    animation: spin 3s linear infinite;
    filter: blur(12px); opacity: 0.6; z-index: -2;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-inner {
    width: 130px; height: 130px; border-radius: 50%;
    background: linear-gradient(135deg, #0d1b4b, #0a0f2e);
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem; position: relative; z-index: 1;
    box-shadow: inset 0 0 40px rgba(26,86,219,0.3);
  }

  /* Orbiting dot */
  .orbit {
    position: absolute; width: 160px; height: 160px; border-radius: 50%;
    animation: orbit 4s linear infinite;
  }
  .orbit-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 12px var(--gold);
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  }
  .orbit-2 {
    width: 190px; height: 190px;
    animation: orbit 6s linear infinite reverse;
  }
  .orbit-dot-2 {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue-4); box-shadow: 0 0 10px var(--blue-4);
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  }
  @keyframes orbit { to { transform: rotate(360deg); } }

  /* Tagline */
  .tagline {
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--gold);
    opacity: 0; transform: translateY(20px);
    animation: slideUp 0.6s ease 1.0s forwards;
    margin-bottom: 16px;
    max-width: 480px;
    line-height: 1.6;
  }

  /* Title */
  .title {
    font-size: clamp(2rem, 6vw, 4rem); font-weight: 800;
    line-height: 1.1; color: var(--white);
    opacity: 0; transform: translateY(30px);
    animation: slideUp 0.7s ease 1.2s forwards;
    margin-bottom: 8px;
  }
  .title span {
    background: linear-gradient(135deg, #3b82f6, #a78bfa, #f59e0b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Subtitle typewriter */
  .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.25rem); color: rgba(255,255,255,0.6);
    font-weight: 400; margin-bottom: 48px; min-height: 2em;
    opacity: 0; animation: fadeIn 0.5s ease 1.8s forwards;
  }

  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Divider */
  .divider {
    width: 0; height: 2px; margin: 0 auto 48px;
    background: linear-gradient(90deg, transparent, #3b82f6, #a78bfa, transparent);
    animation: expand 0.8s ease 1.6s forwards;
  }
  @keyframes expand { to { width: 280px; } }

  /* Progress bar */
  .progress-wrap {
    width: 280px; max-width: 90vw; margin-bottom: 32px;
    opacity: 0; animation: fadeIn 0.5s ease 2s forwards;
  }
  .progress-label {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 0.8125rem; color: rgba(255,255,255,0.4);
    letter-spacing: 0.05em;
  }
  .progress-track {
    height: 4px; background: rgba(255,255,255,0.1); border-radius: 100px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0; border-radius: 100px;
    background: linear-gradient(90deg, #1a56db, #a78bfa, #f59e0b);
    box-shadow: 0 0 12px #3b82f6;
    transition: width 0.1s linear;
  }

  /* Enter button */
  .btn-enter {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 40px; border-radius: 100px;
    font-size: 1rem; font-weight: 700; letter-spacing: 0.05em;
    color: var(--white); border: none; cursor: pointer;
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1a56db, #7c3aed);
    box-shadow: 0 8px 32px rgba(26,86,219,0.5), 0 0 0 0 rgba(26,86,219,0.4);
    opacity: 0; transform: translateY(20px) scale(0.95);
    animation: btnIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 2.2s forwards;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    text-decoration: none;
  }
  @keyframes btnIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .btn-enter::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .btn-enter:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 48px rgba(26,86,219,0.7), 0 0 0 8px rgba(26,86,219,0.15); }
  .btn-enter:hover::before { opacity: 1; }
  .btn-enter:active { transform: scale(0.97); }
  .btn-enter .btn-icon { font-size: 1.125rem; animation: pulse-icon 2s ease-in-out infinite; }
  @keyframes pulse-icon { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }

  /* Skip link */
  .skip {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    font-size: 0.8125rem; color: rgba(255,255,255,0.25);
    cursor: pointer; z-index: 20; letter-spacing: 0.05em;
    transition: color 0.3s;
    opacity: 0; animation: fadeIn 0.5s ease 2.5s forwards;
    border: none; background: none; font-family: inherit;
  }
  .skip:hover { color: rgba(255,255,255,0.6); }

  /* Scroll hint */
  .badge-bottom {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; z-index: 20;
    opacity: 0; animation: fadeIn 0.5s ease 2.8s forwards;
  }
  .badge-pip {
    width: 6px; height: 6px; border-radius: 50%; background: #3b82f6;
    animation: blink 1.5s ease-in-out infinite;
  }
  .badge-pip:nth-child(2) { animation-delay: 0.2s; background: #a78bfa; }
  .badge-pip:nth-child(3) { animation-delay: 0.4s; background: var(--gold); }
  @keyframes blink { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }

  /* Page exit transition */
  .exit-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: #0a0f2e;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .exit-overlay.active { opacity: 1; pointer-events: all; }

  /* Cursor glow */
  .cursor-glow {
    position: fixed; pointer-events: none; z-index: 5;
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    transition: left 0.15s ease, top 0.15s ease;
  }

  @media (max-width: 480px) {
    .logo-inner { width: 110px; height: 110px; font-size: 2.8rem; }
    .logo-ring { width: 120px; height: 120px; }
    .orbit { width: 140px; height: 140px; }
    .orbit-2 { width: 165px; height: 165px; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="aurora">
  <div class="aurora-blob a1"></div>
  <div class="aurora-blob a2"></div>
  <div class="aurora-blob a3"></div>
  <div class="aurora-blob a4"></div>
</div>
<div class="grid"></div>
<div class="stars" id="stars"></div>
<div class="particles" id="particles"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="splash">
  <div class="logo-wrap">
    <div class="orbit"><div class="orbit-dot"></div></div>
    <div class="orbit orbit-2"><div class="orbit-dot-2"></div></div>
    <div class="logo-ring">
      <div class="logo-inner">🎓</div>
    </div>
  </div>

  <div class="tagline">Ikatan Alumni Jurusan Teknik Sipil Poli ITB - Politeknik Negeri Bandung</div>

  <h1 class="title">Beasiswa <span>Alumni</span><br>IKASI</h1>

  <div class="divider"></div>

  <p class="subtitle" id="subtitle"></p>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label">
      <span>Memuat...</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <a href="index.html" class="btn-enter" id="btnEnter" onclick="goEnter(event)">
    <i class="fas fa-door-open btn-icon"></i>
    Masuk ke Website
    <i class="fas fa-arrow-right btn-icon"></i>
  </a>
</div>

<div class="badge-bottom">
  <div class="badge-pip"></div>
  <div class="badge-pip"></div>
  <div class="badge-pip"></div>
</div>

<button class="skip" onclick="goEnter()" id="skipBtn">Lewati →</button>

<div class="exit-overlay" id="exitOverlay"></div>

<script>
sessionStorage.setItem('beasiswa_splash_seen', 'true');

/* ===== STARS ===== */
const starsEl = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  const minOp = (Math.random() * 0.2 + 0.05).toFixed(2);
  const maxOp = (Math.random() * 0.5 + 0.3).toFixed(2);
  s.style.cssText = `
    width:${size}px; height:${size}px;
    top:${Math.random()*100}%; left:${Math.random()*100}%;
    --dur:${(Math.random()*4+2).toFixed(1)}s;
    --delay:-${(Math.random()*6).toFixed(1)}s;
    --min-op:${minOp}; --max-op:${maxOp};
  `;
  starsEl.appendChild(s);
}

/* ===== PARTICLES ===== */
const particlesEl = document.getElementById('particles');
const colors = ['#3b82f6','#a78bfa','#f59e0b','#06b6d4','#93c5fd'];
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random() * 5 + 2;
  const drift = (Math.random() - 0.5) * 200;
  p.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random()*100}%;
    background:${colors[Math.floor(Math.random()*colors.length)]};
    box-shadow:0 0 ${size*3}px ${colors[Math.floor(Math.random()*colors.length)]};
    --dur:${(Math.random()*8+6).toFixed(1)}s;
    --delay:-${(Math.random()*10).toFixed(1)}s;
    --op:${(Math.random()*0.4+0.2).toFixed(2)};
    --drift:${drift.toFixed(0)}px;
  `;
  particlesEl.appendChild(p);
}

/* ===== CURSOR GLOW ===== */
const glow = document.getElementById('cursorGlow');
document.addEventListener('mousemove', e => {
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});

/* ===== TYPEWRITER ===== */
const subtitleEl = document.getElementById('subtitle');
const text = 'Mendukung Mahasiswa Teknik Sipil Berprestasi';
let i = 0;
function typeWriter() {
  if (i <= text.length) {
    subtitleEl.textContent = text.slice(0, i) + (i < text.length ? '|' : '');
    i++;
    setTimeout(typeWriter, i < text.length ? 45 : 600);
  } else {
    subtitleEl.textContent = text;
  }
}
setTimeout(typeWriter, 1900);

/* ===== PROGRESS BAR (auto redirect) ===== */
const bar = document.getElementById('progressBar');
const pct = document.getElementById('progressPct');
let progress = 0;
let autoRedirect = true;

setTimeout(() => {
  const interval = setInterval(() => {
    if (!autoRedirect) { clearInterval(interval); return; }
    progress += 1;
    bar.style.width = progress + '%';
    pct.textContent = progress + '%';
    if (progress >= 100) {
      clearInterval(interval);
      setTimeout(() => { if (autoRedirect) goEnter(); }, 300);
    }
  }, 35); // total ~3.5s
}, 2200);

/* ===== ENTER TRANSITION ===== */
let entered = false;
function goEnter(e) {
  if (e) e.preventDefault();
  if (entered) return;
  entered = true;
  autoRedirect = false;

  const overlay = document.getElementById('exitOverlay');
  overlay.classList.add('active');
  setTimeout(() => { window.location.href = 'index.html'; }, 650);
}

/* ===== KEY SHORTCUT ===== */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') goEnter();
});
</script>
</body>
</html>
